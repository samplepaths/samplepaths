name: Benchmarks

on:
  pull_request:
    branches: [master]

# A new commit on a pull request replaces the runs of the previous one, which
# would otherwise wait for runners ahead of it. Runs on master are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compare-sampling-times:
    name: Compare sampling times with the base branch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Both versions are measured in the same job, so they run on the same
      # machine and their times can be compared.
      - name: Measure both and compare
        run: make -C head benchmark-compare BASE=../base
