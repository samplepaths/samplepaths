name: Tests

on:
  pull_request:
    branches: [master]
  schedule:
    # Daily on master, to notice new releases of the dependencies or of
    # Python which break the tests.
    - cron: "23 3 * * *"

jobs:
  run-tests:
    name: Run tests on ${{ matrix.os }} with Python ${{ matrix.python-version }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run the tests
        run: uv run --no-sync pytest -n auto --cov --cov-report=term-missing:skip-covered
