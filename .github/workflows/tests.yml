name: Tests

on:
  pull_request:
    branches: [master]
  schedule:
    # Daily on master, to notice new releases of the dependencies or of
    # Python which break the tests.
    - cron: "23 3 * * *"

# A new commit on a pull request replaces the runs of the previous one, which
# would otherwise wait for runners ahead of it. Runs on master are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    name: Run tests on ${{ matrix.os }} with Python ${{ matrix.python-version }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # make runs its commands with the shell it finds, so use bash on every
    # system, Windows included.
    defaults:
      run:
        shell: bash

    env:
      # Run in the environment which make install-test created, without
      # adding the other development tools to it.
      UV_NO_SYNC: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make install-test

      - name: Run the tests
        run: make coverage
