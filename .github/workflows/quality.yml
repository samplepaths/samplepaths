name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-typecheck-build-docs:
    name: Lint, type check and build the docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run ruff
        run: make lint

      - name: Run mypy
        run: make typecheck

      - name: Build the documentation
        run: make docs
