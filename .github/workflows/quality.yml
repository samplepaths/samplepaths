name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new commit on a pull request replaces the runs of the previous one, which
# would otherwise wait for runners ahead of it. Runs on master are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-build-docs:
    name: Lint, type check and build the docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Run ruff
        run: make lint

      - name: Run mypy
        run: make typecheck

      - name: Build the documentation
        run: make docs

  # Realizations for a given seed must not change from one version to the
  # next. A change which is meant, such as a fix, makes this job fail: say so
  # in the changelog and merge with the job red.
  compare-seeded-results:
    name: Compare seeded results with the last release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the last release is read from the git tags

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Compare with the last release
        run: make check-seeded
