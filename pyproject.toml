[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "samplepaths"
version = "0.1.0"
description = "Generate realizations of stochastic processes"
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Bassem Girgis", email = "brgirgis@gmail.com" },
  { name = "Christopher Flynn", email = "crf204@gmail.com" },
]
maintainers = [{ name = "Bassem Girgis", email = "brgirgis@gmail.com" }]
keywords = ["stochastic", "processes", "simulation", "monte carlo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = ["numpy>=2.2.6", "scipy>=1.15.3"]


[project.urls]
Homepage = "https://github.com/samplepaths/samplepaths"
Repository = "https://github.com/samplepaths/samplepaths"
Issues = "https://github.com/samplepaths/samplepaths/issues"
Author = "https://girgis.me"


[dependency-groups]
test = ["pytest>=9.0.2", "pytest-cov>=7.0.0", "pytest-xdist>=3.8.0"]
lint = ["mypy>=1.19.1", "ruff>=0.14.0", "scipy-stubs>=1.15.3.0"]
docs = [
  "matplotlib>=3.10.8",
  "sphinx>=8.1.3",
  "sphinx-autobuild>=2024.10.3",
  "furo>=2025.9.25",
]
# The notebooks compare samplepaths against the original stochastic package.
notebooks = [
  "ipykernel>=7.1.0",
  "nbformat>=5.10.4",
  "plotly>=6.5.2",
  "stochastic>=0.4.0",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "docs" },
  { include-group = "notebooks" },
]


[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.rst", "/LICENSE"]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage.run]
source = ["samplepaths"]


[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "T20", # flake8-print
  "D",   # pydocstyle
]
ignore = [
  "D105", # magic methods need no docstring
  "D107", # constructor parameters are documented in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/conf.py" = ["D"]
"docs/scripts/make_images.py" = ["T20"]


[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
